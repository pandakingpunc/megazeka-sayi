[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "megazeka-sayi"
version = "0.1.0"
description = "Megazeka-Sayı: Türkçe ters metin normalleştirme (ASR'deki yazıyla sayıları TDK rakam biçimine çevirme)"
readme = "docs/SPEC.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Mustafa Karatüm" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
